name: nyc_taxi
version: "1.0.0"
config-version: 2
profile: nyc_taxi

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Real taxi data contains garbage timestamps (e.g. 2002, 2098). Staging filters them out.
  min_pickup_date: "2024-01-01"
  max_pickup_date: "2025-12-31"

models:
  nyc_taxi:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  nyc_taxi:
    taxi_zone_lookup:
      +column_types:
        location_id: integer
